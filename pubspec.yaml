name: gallerie
description: "Galerie de photos connectee a Google Drive et Lightroom."
publish_to: 'none'

version: 1.0.14+15

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  http: ^1.2.2
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  google_sign_in_android: ^6.1.26

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/catalog.json
    - assets/data/world_countries.json
